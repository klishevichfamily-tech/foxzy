plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}
version = mod_version
group = 'team.foxed.foxzy'
base { archivesName = 'foxzy-neoforge-1.21.1' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
repositories { mavenCentral() }
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {}
    server { argument '--nogui' }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('test', Test) { useJUnitPlatform() }
